name: vFlat
options:
  bundleIdPrefix: com.voyagerx.ios
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

targets:
  vFlat:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ios/Sources/Core
      - path: ios/Sources/UI
      - path: ios/Sources/vFlatApp
    info:
      path: ios/Info.plist
      properties:
        CFBundleDisplayName: "vFlat Scan"
        NSCameraUsageDescription: "需要使用您的相機權限以進行書本掃描、邊緣偵測與即時曲面展平。"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_NAME: "vFlat"
        PRODUCT_BUNDLE_IDENTIFIER: "com.voyagerx.ios.vflat"
        SWIFT_VERSION: "5.9"
        ENABLE_BITCODE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ios/Info.plist
        INFOPLIST_KEY_NSCameraUsageDescription: "需要使用您的相機權限以進行書本掃描、邊緣偵測與即時曲面展平。"
        INFOPLIST_KEY_CFBundleDisplayName: "vFlat Scan"

