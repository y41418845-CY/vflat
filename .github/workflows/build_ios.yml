name: Build iOS IPA

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          if ls -d /Applications/Xcode_16*.app 1> /dev/null 2>&1; then
            TARGET_XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
            echo "Selecting $TARGET_XCODE"
            sudo xcode-select -s "$TARGET_XCODE"
          fi
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project vFlat.xcodeproj \
            -scheme vFlat \
            -destination "generic/platform=iOS" \
            -archivePath build/vFlat.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/vFlat.xcarchive/Products/Applications/vFlat.app Payload/
          zip -r vFlat.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vFlat-iOS-Unsigned-IPA
          path: vFlat.ipa
          retention-days: 14
