name: Build iOS IPA

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if ls -d /Applications/Xcode_16*.app 1> /dev/null 2>&1; then
            TARGET_XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
            echo "Selecting $TARGET_XCODE"
            sudo xcode-select -s "$TARGET_XCODE"
          fi
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project vFlat.xcodeproj \
            -scheme vFlat \
            -destination "generic/platform=iOS" \
            -archivePath build/vFlat.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/vFlat.xcarchive/Products/Applications/vFlat.app Payload/
          zip -r vFlat.ipa Payload
          rm -rf Payload

      - name: Release IPA on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: "v0.4.4"
          name: "vFlat iOS v0.4.4"
          body: "vFlat Scan iOS 雲端自動編譯產出之未簽名 IPA 安裝包，可透過 Sideloadly 進行免越獄安裝。"
          files: vFlat.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload IPA Artifact (Optional)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: vFlat-iOS-Unsigned-IPA
          path: vFlat.ipa
          retention-days: 7
