name: Build & Test iOS IPA

on:
  push:
    branches: [ master, main, 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main, 'feature/**' ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if ls -d /Applications/Xcode_16*.app 1> /dev/null 2>&1; then
            TARGET_XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
            echo "Selecting $TARGET_XCODE"
            sudo xcode-select -s "$TARGET_XCODE"
          fi
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Unit Tests
        run: |
          set -o pipefail
          # 優先由 simctl 抓取唯一的 Simulator UUID，避免名稱後綴 (Shutdown) 影響匹配
          SIM_ID=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | grep -o -E '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}')
          if [ -n "$SIM_ID" ]; then
            echo "Selected simulator UUID: $SIM_ID"
            DEST="platform=iOS Simulator,id=$SIM_ID"
          else
            echo "Falling back to generic iOS Simulator"
            DEST="generic/platform=iOS Simulator"
          fi

          xcodebuild test \
            -project vFlat.xcodeproj \
            -scheme vFlat \
            -destination "$DEST" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project vFlat.xcodeproj \
            -scheme vFlat \
            -destination "generic/platform=iOS" \
            -archivePath build/vFlat.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/vFlat.xcarchive/Products/Applications/vFlat.app Payload/
          zip -r vFlat.ipa Payload
          rm -rf Payload

      - name: Cleanup old artifacts (保留最近 5 個)
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const sorted = (data.artifacts || []).sort(
              (a, b) => new Date(b.created_at) - new Date(a.created_at)
            );
            const toDelete = sorted.slice(5);
            for (const a of toDelete) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: a.id
              });
            }
            core.info(`Deleted ${toDelete.length} old artifacts, kept ${Math.min(sorted.length, 5)}`);

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: vFlat-iOS-Unsigned-IPA
          path: vFlat.ipa
          retention-days: 3

      - name: Resolve Release Tag
        id: release_tag
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="$(tr -d '\r\n' < VERSION)"
          fi
          if [[ -z "$TAG_NAME" ]]; then
            echo "::error::VERSION 檔案為空，無法決定 release tag"
            exit 1
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG_NAME"

      - name: Release IPA on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "vFlat iOS ${{ steps.release_tag.outputs.tag }}"
          body: "vFlat Scan iOS 雲端自動編譯產出之未簽名 IPA 安裝包，可透過 Sideloadly 進行免越獄安裝。"
          files: vFlat.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
